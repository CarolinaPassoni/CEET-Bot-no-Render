services:
  - type: web
    name: ceet-bot
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz.php
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ceet-bot-db
          property: connectionString

      - key: APP_SECRET
        generateValue: true

      - key: SETUP_KEY
        sync: false

      - key: PORT
        value: "10000"

databases:
  - name: ceet-bot-db
    plan: free
    region: virginia
